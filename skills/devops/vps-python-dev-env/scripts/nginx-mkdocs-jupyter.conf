# nginx config: MkDocs static site at / + Jupyter Notebook at /lab/
# Copy to /etc/nginx/sites-enabled/default, then:
#   sudo nginx -t && sudo systemctl reload nginx
# 
# ⚠️ 替换 USERNAME 为你的服务器用户名
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # MkDocs practice site (static HTML)
    root /home/USERNAME/python-practice/site/site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Jupyter Notebook (reverse proxy with WebSocket)
    location /lab/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required by Jupyter kernel)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long-running cells: don't timeout
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Jupyter static assets (cache aggressively)
    location ~* /lab/static/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}